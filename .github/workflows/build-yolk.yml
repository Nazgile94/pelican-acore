name: Build & publish Pelican Yolk

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
    paths:
      - "Dockerfile"
      - "entrypoint.sh"
      - "start.sh"
      - "scripts/generate_egg.py"
      - ".github/workflows/build-yolk.yml"

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set lowercase GHCR image name
        shell: bash
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/azerothcore-pelican-aio" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Yolk
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate ready-to-import Egg
        shell: bash
        run: |
          mkdir -p dist
          python3 scripts/generate_egg.py \
            --image "${IMAGE_NAME}:latest" \
            --output dist/egg-azerothcore-aio.json
          python3 scripts/validate_repo.py --egg dist/egg-azerothcore-aio.json

      - name: Upload Egg artifact
        uses: actions/upload-artifact@v4
        with:
          name: pelican-azerothcore-aio-egg
          path: dist/egg-azerothcore-aio.json

      - name: Attach Egg to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" dist/egg-azerothcore-aio.json --clobber
