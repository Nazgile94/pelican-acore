name: Validate repository

on:
  pull_request:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Generate placeholder egg
        run: python3 scripts/generate_egg.py
      - name: Validate shell and egg
        run: python3 scripts/validate_repo.py
